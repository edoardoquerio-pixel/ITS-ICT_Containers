services:
  # --- API Gateway (nginx) ---
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "80:80"
    depends_on:
      book-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      loan-service:
        condition: service_healthy
      review-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - microservice-network
    restart: unless-stopped

  # --- Database PostgreSQL (book) ---
  db:
    image: postgres:16-alpine
    container_name: book-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: books
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - book-db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Book Service (FastAPI) ---
  book-service:
    build: ./book-service
    container_name: book-service
    depends_on:
      db:
        condition: service_healthy
    networks:
      - microservice-network
      - book-db-network
    environment:
      DATABASE_TYPE: postgres
      DATABASE_URL: postgresql://postgres:postgres@db:5432/books
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --- User Database ---
  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    volumes:
      - user-pg-data:/var/lib/postgresql/data
    networks:
      - user-db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- User Service ---
  user-service:
    build: ./user-service
    container_name: user-service
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - microservice-network
      - user-db-network
    environment:
      DATABASE_TYPE: postgres
      DATABASE_URL: postgresql://postgres:postgres@user-db:5432/users
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

