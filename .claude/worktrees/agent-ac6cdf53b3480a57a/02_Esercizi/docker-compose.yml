  pg-data:
  user-pg-data:
  loan-pg-data:
  review-pg-data:
  inventory-pg-data:
  notification-pg-data:

networks:
  microservice-network:
  book-db-network:
    internal: true
  user-db-network:
    internal: true
  loan-db-network:
    internal: true
  review-db-network:
    internal: true
  inventory-db-network:
    internal: true
  notification-db-network:
    internal: true
